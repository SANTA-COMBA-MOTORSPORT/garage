<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Couto Garage Inventario</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>/* Plan: el propio garaje como mundo visual. Negro, blanco y franja magenta. Móvil primero: barra inferior al alcance del pulgar,
   portada con resumen, plano por zonas y cada mueble en 3D sobre su pared. Tema oscuro único, a propósito. */
:root{
  color-scheme:dark;
  --bg:#0e0d10; --surface:#1a181e; --raise:#26232b; --ink:#f5f2f7; --muted:#a9a2af; --line:#35303b;
  --accent:#ff2e9a; --accent2:#c4006e; --accent-ink:#1a0610;
  --ok:#4cc27f; --warn:#f0a23a; --bad:#ff6b6b;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(120% 420px at 50% -80px,#3a0f27 0%,rgba(58,15,39,0) 70%),var(--bg);background-repeat:no-repeat;color:var(--ink);font:400 16px/1.4 var(--body);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:5;background:rgba(11,10,13,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 16px 12px}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2) 60%,transparent)}
.top{display:flex;gap:12px;align-items:center;max-width:720px;margin:0 auto}
h1{font:700 26px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0;white-space:nowrap}
h1 span{color:var(--accent)}
#q{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
main{max-width:720px;margin:0 auto;padding:14px 16px 120px;display:flex;flex-direction:column;gap:16px}
@media (prefers-reduced-motion: no-preference){main.enter{animation:viewin .28s ease-out}}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}}
/* barra inferior */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;align-items:flex-end;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(17,15,20,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bnav:empty{display:none}
.bnav button{flex:1;max-width:120px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font:600 12px var(--body)}
.bnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bnav button[aria-current="true"]{color:var(--accent)}
.bnav .fab{flex:none;width:60px;height:60px;border-radius:50%;margin:-26px 6px 0;background:linear-gradient(145deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 22px rgba(255,46,154,.45),0 0 0 5px var(--bg);justify-content:center}
.bnav .fab svg{width:30px;height:30px;stroke-width:2.6}
/* portada */
.hero{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.eyebrow{font:600 13px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0}
.big{font:700 40px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:1px solid var(--line);border-top:3px solid var(--ok);background:var(--surface);border-radius:var(--r);padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat.warn{border-top-color:var(--warn)}.stat.mute{border-top-color:var(--muted)}
.stat b{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.zones{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.zone{border:1px solid var(--line);background:linear-gradient(180deg,var(--raise),var(--surface));border-radius:var(--r);padding:12px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;min-width:0}
.zone .mini{height:64px;width:38px;grid-row:1/3}
.zone strong{align-self:end}
.zone strong{font:700 18px/1 var(--display);overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.05em}
.zone span{font-size:12px;color:var(--muted);align-self:start}
.sect{display:flex;flex-direction:column;gap:10px}
.secthd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2{font:700 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0;text-wrap:balance}
.lites{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.lite{display:flex;align-items:center;gap:10px;padding:11px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.lite:last-child{border-bottom:0}
.lite i{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.lite.low i{background:var(--warn)}.lite.empty i{background:var(--bad)}
.lite .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lite .q{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.start{border-color:var(--accent);background:linear-gradient(160deg,#2a1220,var(--surface) 70%)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 16px/28px var(--display);text-align:center}
/* piezas comunes */
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.seg.zonas{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;flex-wrap:nowrap}
.seg.zonas button{flex:1;border:0;background:none;font:700 16px var(--display);text-transform:uppercase;letter-spacing:.05em;padding:8px 6px;color:var(--muted)}
.seg.zonas button[aria-pressed="true"]{background:linear-gradient(145deg,var(--accent),var(--accent2));color:#fff}
.chip small{opacity:.75;margin-left:5px}
.scrollx{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.planwrap{background:linear-gradient(180deg,#221f27,#151318);border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
svg#plan{display:block;width:100%;max-width:520px;margin:0 auto;height:auto;user-select:none;-webkit-user-select:none}
svg#plan.edit{touch-action:none}
.wall{stroke:#f1eef3;stroke-width:.17;stroke-linejoin:round}
.wall2{fill:none;stroke:var(--accent);stroke-width:.05;stroke-linejoin:round}
.inwall{stroke:#f1eef3;stroke-width:.13;fill:none}
.stairs{fill:rgba(0,0,0,.28);stroke:#f1eef3;stroke-width:.03}
.zl{font:700 .62px var(--display);font-size:calc(var(--k,10.75)*.058px);fill:#fff;letter-spacing:.08em;text-anchor:middle;opacity:.3;pointer-events:none}
.fl{font:600 .25px var(--body);font-size:calc(var(--k,10.75)*.031px);fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.8);stroke-width:.07;pointer-events:none}
.fl.in{text-anchor:middle;stroke-width:.05;font-size:calc(var(--k,10.75)*.027px)}
.acts{display:flex;gap:8px;margin-left:auto}
.bd{pointer-events:none}
.bd circle{fill:var(--accent);stroke:#fff;stroke-width:.035}
.bd text{font:700 .25px var(--body);font-size:calc(var(--k,10.75)*.03px);fill:#1a0610;text-anchor:middle}
.hit{fill:transparent}
.furn{cursor:pointer}
.furn.sel .body{stroke:var(--accent);stroke-width:.1}
@media (prefers-reduced-motion: no-preference){.furn.sel .body{animation:pulse 1s ease-in-out 3}}
@keyframes pulse{50%{stroke-opacity:.2}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.code{font:600 13px ui-monospace,Menlo,Consolas,monospace;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:10px 15px;font-weight:600;font-size:15px}
.btn.pri{background:linear-gradient(145deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(255,46,154,.3)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.link{border:0;background:none;color:var(--ink);text-decoration:underline;padding:0;font-size:13px}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ok)}
.item.low::before{background:var(--warn)}.item.empty::before{background:var(--bad)}
#sheet .item{background:var(--raise)}
.it-top{display:flex;gap:12px;align-items:flex-start}
.thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--raise);flex:none}
.thumb.ph{display:flex;align-items:center;justify-content:center;font:700 19px var(--display);letter-spacing:.03em;color:#fff}
.item .nm{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.item .where{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.item .where button{border:0;padding:0;background:none}
.item .where button .code{border-color:var(--accent);color:var(--accent)}
.tagv{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink)}
.tago{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--warn);color:#1a1206}
.kit{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;width:100%}
.kit strong{font:700 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;display:block}
.kit span{font-size:13px;color:var(--muted)}
.ring{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--raise) 0)}
.ring::before{content:attr(data-t);width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:700 12px var(--body);color:var(--ink)}
.bar{height:8px;border-radius:999px;background:var(--raise);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:calc(var(--p)*1%);transition:width .3s}
.chk{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.chk:last-child{border-bottom:0}
.chk .box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;color:transparent;font-weight:700}
.chk.on .box{background:var(--accent);border-color:var(--accent);color:#fff}
.chk.on .nm{text-decoration:line-through;color:var(--muted)}
.chk .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.chk small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.ej{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px dashed var(--muted);border-radius:4px;padding:0 5px;margin-left:6px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--raise)}
.qty button{border:0;background:none;width:40px;height:40px;font-size:20px;font-weight:600}
.qty span{min-width:38px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:17px}
.pill{border:0;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700;color:#10130f;background:var(--ok)}
.pill.low{background:var(--warn)} .pill.empty{background:var(--bad)}
input[type=text],input[type=number],input[type=password],input[type=file],select,textarea{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--raise);width:100%;min-width:0}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f.w{grid-column:1/-1}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.fcard .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;justify-content:space-between}
.subs{display:flex;gap:5px;flex-wrap:wrap}
.cajas{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.cajas span{font-size:13px;color:var(--muted)}
.empty-msg{color:var(--muted);font-size:14px;margin:0}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 8px currentColor}.dot.pend{background:var(--warn)}.dot.off{background:var(--muted)}
.login{max-width:380px;width:100%;margin:8vh auto 0;padding:22px;gap:14px;border-top:4px solid var(--accent)}
.rev{display:grid;grid-template-columns:auto 1fr 64px;gap:8px;align-items:center}
.rev input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:1px solid var(--line);background:var(--raise);border-radius:var(--r);padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.opt svg{width:38px;height:38px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.opt strong{font:700 19px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.opt span{font-size:13px;color:var(--muted)}
/* panel superpuesto */
#sheet{position:fixed;inset:0;z-index:20}
.backdrop{position:absolute;inset:0;background:rgba(5,4,7,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{position:absolute;left:8px;right:8px;top:44px;bottom:0;max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:22px 22px 0 0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px 14px calc(24px + env(safe-area-inset-bottom))}
.card.low{top:auto;max-height:80vh}
.card .hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card .x{border:1px solid var(--line);background:var(--raise);border-radius:999px;width:40px;height:40px;font-size:18px;flex:none}
.stage{display:block;width:100%;max-height:44vh;border-radius:14px}
.foto-big{max-width:100%;max-height:220px;border-radius:14px;align-self:flex-start;background:var(--raise);min-height:60px;min-width:60px}
.cell{cursor:pointer}
.cell .ov{fill:transparent;stroke:transparent}
.cell.on .ov{fill:rgba(255,46,154,.3);stroke:var(--accent)}
.cl{font-family:var(--body);font-weight:600;text-anchor:middle;pointer-events:none}
@media (prefers-reduced-motion: no-preference){
  .card.anim{animation:zoom .42s cubic-bezier(.2,.9,.25,1)}
  .card.low.anim{animation:rise .3s cubic-bezier(.2,.9,.25,1)}
  .card.anim .cell{animation:cin .45s both}
  .card.anim .bx{animation:drop .5s cubic-bezier(.2,.9,.25,1) both}
}
@keyframes zoom{from{transform:scale(.1);opacity:0}}
@keyframes rise{from{transform:translateY(100%)}}
@keyframes cin{from{opacity:0}}
@keyframes drop{from{opacity:0;transform:translateY(-.25px)}}
#toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);z-index:30;background:#fff;color:#17151a;font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#print{display:none}
@media print{
 html,body{background:#fff!important;color:#000}
 header,main,#sheet,.bnav,#toast{display:none!important}
 #print{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm;padding:6mm}
 .lab{border:1px dashed #888;padding:3mm;display:flex;gap:3mm;align-items:center;break-inside:avoid;color:#000;min-width:0}
 .lab svg{width:22mm;height:22mm;flex:none}
 .lab b{font:700 11pt ui-monospace,Menlo,Consolas,monospace;display:block;overflow-wrap:anywhere}
 .lab span{font:8pt Arial,sans-serif}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Couto <span>Garage</span></h1>
    <input id="q" type="text" placeholder="Buscar: aceite, M6, camiseta..." autocomplete="off" aria-label="Buscar artículo">
  </div>
</header>
<main id="app"></main>
<nav id="tabs" class="bnav" aria-label="Secciones"></nav>
<div id="sheet" hidden></div>
<div id="toast" role="status"></div>
<div id="print"></div>

   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD1 = 0x11;

          }
        }

      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

          }

    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {

          pattern = i;

      return pattern;
    };

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

          }

function applyLocal(o){
 var it,c,p,k;
 if(o.t==='itemAdd')state.items.unshift(o.item);
 else if(o.t==='itemSet'){it=itemById(o.id);if(it)for(k in o.f)it[k]=o.f[k];}
 else if(o.t==='itemDel')state.items=state.items.filter(function(i){return String(i.id)!==String(o.id);});
 else if(o.t==='cajaSet'){c=cajaOf(o.id);if(c)c.loc=o.loc;}
 else if(o.t==='cajaAdd')state.cajas.push({id:o.id,t:o.tipo,loc:''});
 else if(o.t==='palSet'){p=palById(o.id);if(p){p.x=o.x;p.y=o.y;p.rot=o.rot;}else state.pallets.push({id:o.id,x:o.x,y:o.y,rot:o.rot});}
 else if(o.t==='palDel'){state.pallets=state.pallets.filter(function(q){return q.id!==o.id;});state.items.forEach(function(i){if(i.loc===o.id)i.loc='';});}
 else if(o.t==='posSet')state.pos[o.id]={x:o.x,y:o.y,rot:o.rot};
 else if(o.t==='posDel')delete state.pos[o.id];
 else if(o.t==='kitSet'){if(!state.kits)state.kits=[];var kk=null;state.kits.forEach(function(x){if(x.id===o.id)kk=x;});if(kk){kk.name=o.name;kk.items=o.items.slice();kk.done=o.done.slice();}else state.kits.push({id:o.id,name:o.name,items:o.items.slice(),done:o.done.slice()});}
 else if(o.t==='kitDel'){state.kits=(state.kits||[]).filter(function(x){return x.id!==o.id;});}
}

/* recorte de cada herramienta a partir de la foto de la bandeja */
function cropBox(img,box){
 return new Promise(function(res,rej){
  var im=new Image();
  im.onload=function(){
   var y0=box[0]/1000*im.height,x0=box[1]/1000*im.width,y1=box[2]/1000*im.height,x1=box[3]/1000*im.width,pw=(x1-x0)*.08,ph=(y1-y0)*.08;
   x0=Math.max(0,x0-pw);y0=Math.max(0,y0-ph);x1=Math.min(im.width,x1+pw);y1=Math.min(im.height,y1+ph);
   var w=x1-x0,h=y1-y0;if(w<8||h<8){rej(new Error('recorte vacío'));return;}
   var c=document.createElement('canvas'),d='',size=420,q=.62;
   for(var k=0;k<8;k++){var s=Math.min(1,size/Math.max(w,h));c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,x0,y0,w,h,0,0,c.width,c.height);d=c.toDataURL('image/jpeg',q);if(d.length<=46000)break;size*=.8;}
   res(d);
  };
  im.onerror=function(){rej(new Error('imagen'));};im.src=img;
 });
}
function uploadCrops(jobs,img){
 if(!jobs.length||!img)return;
 var tries=0,go=function(){
  if(!DEMO&&(pending.length||net.busy)){if(++tries>60)return;setTimeout(go,500);return;}
  var next=function(){var j=jobs.shift();if(!j){softRender();return;}
   cropBox(img,j.box).then(function(d){return api('fotoSet',{id:j.id,data:d}).then(function(){fotoCache[j.id]=d;var it=itemById(j.id);if(it)it.foto=1;saveLocal();});}).catch(function(){}).then(next);};
  next();
 };
 go();
}
